# =============================================================
# .woodpecker/ci.yml
# =============================================================

when:
  event: [push, pull_request]

steps:
  - name: ci-pipeline
    image: induzio-ci-runner:latest
    pull: false            # image is built locally on the agent server
    privileged: true       # required for Docker-in-Docker

    environment:
      GITHUB_TOKEN:
        from_secret: github_token

      SENDGRID_KEY:
        from_secret: sendgrid_key

    volumes:
      - /srv/ci-artifacts:/ci/artifacts

    commands:
      - bash /ci/scripts/entrypoint.sh

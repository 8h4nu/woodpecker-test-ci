# =============================================================
# .woodpecker/ci.yml
# =============================================================

when:
  event: [push, pull_request]

steps:
  - name: ci-pipeline
    image: induzio-ci-runner:latest
    pull: false

    environment:
      GITHUB_TOKEN:
        from_secret: github_token

    commands:
      - bash /ci/scripts/entrypoint.sh

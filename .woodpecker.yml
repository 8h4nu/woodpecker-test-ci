# =============================================================
# .woodpecker.yml
#
# Every PR triggers ONE privileged DinD container that:
#   - starts all DB services via docker compose
#   - builds enclavemesh + izenclave
#   - runs pytest smoke suite
#   - sends email + updates GitHub PR status
#   - destroys everything on exit (success or failure)
# =============================================================

when:
  event: pull_request

steps:
  - name: ci-pipeline
    image: induzio-ci-runner:latest
    pull: false            # image is built locally on the agent server
    privileged: true       # required for Docker-in-Docker

    environment:
      GITHUB_TOKEN:
        from_secret: github_token

      SENDGRID_KEY:
        from_secret: sendgrid_key

    volumes:
      - /srv/ci-artifacts:/ci/artifacts

    commands:
      - bash /ci/scripts/entrypoint.sh
